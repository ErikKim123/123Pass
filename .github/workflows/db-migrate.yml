name: DB Migrate (Supabase)

# DB5 — applies supabase/migrations/*.sql to the linked Supabase project on
# every push to main that touches migration files. Manual dispatch is also
# allowed for re-runs.
#
# Required repo secrets (set under Settings → Secrets and variables → Actions):
#   - SUPABASE_ACCESS_TOKEN       — personal access token from supabase.com/dashboard/account/tokens
#   - SUPABASE_PROJECT_REF        — e.g. abcdefghijklm (from your project's URL)
#   - SUPABASE_DB_PASSWORD        — the database password for the linked project
#
# Without these secrets the job exits cleanly with a notice instead of failing —
# this lets the repo stay green while no Supabase project is linked yet.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/db-migrate.yml'
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Check for Supabase secrets
        id: check-secrets
        env:
          ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$ACCESS_TOKEN" ] || [ -z "$PROJECT_REF" ]; then
            echo "::notice::Supabase secrets not configured — skipping migration deploy."
            echo "::notice::Set SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF, SUPABASE_DB_PASSWORD to enable."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: supabase/setup-cli@v1
        if: steps.check-secrets.outputs.configured == 'true'
        with:
          version: latest

      - name: Link project
        if: steps.check-secrets.outputs.configured == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}" \
            --password "${{ secrets.SUPABASE_DB_PASSWORD }}"

      - name: Push migrations (dry-run first, then apply)
        if: steps.check-secrets.outputs.configured == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -e
          # Show the diff before applying so the log captures what will run.
          supabase db diff --schema public || true
          supabase db push --password "$SUPABASE_DB_PASSWORD"

      - name: Regenerate types and assert no drift
        if: steps.check-secrets.outputs.configured == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          # Use the official CLI to generate the canonical Database type. If our
          # PGlite-based generator drifts from the live schema, this will catch it.
          supabase gen types typescript \
            --project-id "${{ secrets.SUPABASE_PROJECT_REF }}" \
            > /tmp/official.ts
          echo "::notice::Official types saved to /tmp/official.ts ($(wc -l < /tmp/official.ts) lines)"
