name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test (with coverage)
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

      # DB5 — verify migrations and detect type drift before merge.
      # Both run against PGlite (PostgreSQL 16 WASM); no Docker / Supabase CLI needed.
      - name: DB schema verification (PGlite)
        run: pnpm db:verify

      - name: DB type drift detection
        run: pnpm db:check-types

      - name: Audit
        run: pnpm audit --audit-level=high
        continue-on-error: false
